services:
  # PostgreSQL Database
  postgres:
    image: postgres:15-alpine
    container_name: alejandria-db
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-alejandria}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-alejandria}
      POSTGRES_DB: ${POSTGRES_DB:-alejandria}
    volumes:
      - postgres_data:/var/lib/postgresql/data
      - ./scripts/init-db.sql:/docker-entrypoint-initdb.d/init.sql
    # Port 5432 NOT exposed externally — DB only accessible within Docker network
    restart: unless-stopped
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-alejandria}"]
      interval: 10s
      timeout: 5s
      retries: 5
    networks:
      - alejandria

  # Backend API
  backend:
    build: ./backend
    container_name: alejandria-backend
    environment:
      - DATABASE_URL=postgresql://${POSTGRES_USER:-alejandria}:${POSTGRES_PASSWORD:-alejandria}@postgres:5432/${POSTGRES_DB:-alejandria}
      - DOWNLOAD_DIR=/downloads
      - LIBRARY_DIR=/library
      - CHECK_INTERVAL_HOURS=${CHECK_INTERVAL_HOURS:-6}
      - KCC_PROFILE=${KCC_PROFILE:-KPW5}
      - KCC_FORMAT=${KCC_FORMAT:-EPUB}
      - LOG_LEVEL=${LOG_LEVEL:-INFO}
      # TeraBox cookies for automatic downloads (see README.md for instructions)
      - TERABOX_COOKIE=${TERABOX_COOKIE:-}
      # ComicVine API for comic metadata (get key at comicvine.gamespot.com/api/)
      - COMICVINE_API_KEY=${COMICVINE_API_KEY:-}
      # Google Books API for book metadata (get key at console.cloud.google.com/apis/credentials)
      - GOOGLE_BOOKS_API_KEY=${GOOGLE_BOOKS_API_KEY:-}
      # Captcha resolver API key (2captcha.com) for resolving shortener captchas
      - CAPTCHA_API_KEY=${CAPTCHA_API_KEY:-}
      # FlareSolverr URL for bypassing Cloudflare protection (ouo.io/ouo.press)
      - FLARESOLVERR_URL=${FLARESOLVERR_URL:-http://flaresolverr:8191}
      # Disable scheduler in backend (runs in separate container)
      - DISABLE_SCHEDULER=true
      # Import folder for external files (Feature 5)
      - IMPORT_DIR=/imports
      # STK data directory (outside /app to survive bind mount)
      - STK_DATA_DIR=/stk-data
    volumes:
      - downloads:/downloads
      - library:/library
      - imports:/imports
      - stk_data:/stk-data
      - ./backend:/app
    ports:
      - "9878:7878"
    depends_on:
      postgres:
        condition: service_healthy
    restart: unless-stopped
    networks:
      - alejandria

  # Scheduler Worker (background jobs: downloads, conversions, Kindle sending)
  scheduler:
    build:
      context: .
      dockerfile: workers/scheduler/Dockerfile
    container_name: alejandria-scheduler
    environment:
      - DATABASE_URL=postgresql://${POSTGRES_USER:-alejandria}:${POSTGRES_PASSWORD:-alejandria}@postgres:5432/${POSTGRES_DB:-alejandria}
      - DOWNLOAD_DIR=/downloads
      - LIBRARY_DIR=/library
      - CHECK_INTERVAL_HOURS=${CHECK_INTERVAL_HOURS:-6}
      - COMICVINE_API_KEY=${COMICVINE_API_KEY:-}
      - GOOGLE_BOOKS_API_KEY=${GOOGLE_BOOKS_API_KEY:-}
      - CAPTCHA_API_KEY=${CAPTCHA_API_KEY:-}
      - FLARESOLVERR_URL=${FLARESOLVERR_URL:-http://flaresolverr:8191}
      - IMPORT_DIR=/imports
    volumes:
      - downloads:/downloads
      - library:/library
      - imports:/imports
    depends_on:
      postgres:
        condition: service_healthy
    restart: unless-stopped
    networks:
      - alejandria

  # KCC Converter Worker
  kcc-converter:
    build: ./workers/kcc-converter
    container_name: alejandria-converter
    environment:
      - WATCH_DIR=/downloads
      - OUTPUT_DIR=/library/kindle
      - KCC_PROFILE=${KCC_PROFILE:-KPW5}
      - KCC_FORMAT=${KCC_FORMAT:-EPUB}
      - KCC_QUALITY=${KCC_QUALITY:-85}
    volumes:
      - downloads:/downloads
      - library:/library
    restart: unless-stopped
    networks:
      - alejandria

  # Frontend Web UI (Kaizoku-style)
  frontend:
    build: ./frontend
    container_name: alejandria-frontend
    ports:
      - "8888:80"
    depends_on:
      - backend
    restart: unless-stopped
    networks:
      - alejandria

  # FlareSolverr - bypasses Cloudflare for ouo.io/ouo.press shortener resolution
  flaresolverr:
    image: ghcr.io/flaresolverr/flaresolverr:latest
    container_name: alejandria-flaresolverr
    environment:
      - LOG_LEVEL=info
      - CAPTCHA_SOLVER=none
    ports:
      - "8191:8191"
    restart: unless-stopped
    networks:
      - alejandria

  # Watchtower (Optional - auto-updates containers)
  # watchtower:
  #   image: containrrr/watchtower
  #   container_name: alejandria-watchtower
  #   volumes:
  #     - /var/run/docker.sock:/var/run/docker.sock
  #   command: --cleanup --interval 86400
  #   restart: unless-stopped
  #   networks:
  #     - alejandria

volumes:
  postgres_data:
    driver: local
  downloads:
    driver: local
  library:
    driver: local
  imports:
    driver: local
  stk_data:
    driver: local

networks:
  alejandria:
    driver: bridge
