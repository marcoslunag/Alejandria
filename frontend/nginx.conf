server {
    listen 80;
    server_name localhost;
    root /usr/share/nginx/html;
    index index.html;

    # Upload limit — the backend accepts up to 2 GB; set nginx well above that
    client_max_body_size 2100m;

    # Security headers
    add_header X-Content-Type-Options "nosniff" always;
    add_header X-Frame-Options "SAMEORIGIN" always;
    add_header X-XSS-Protection "1; mode=block" always;
    add_header Referrer-Policy "strict-origin-when-cross-origin" always;
    add_header Permissions-Policy "camera=(), microphone=(), geolocation=()" always;
    # Note: CSP and HSTS should be added when HTTPS is configured

    # Gzip compression
    gzip on;
    gzip_vary on;
    gzip_min_length 1024;
    gzip_types text/plain text/css text/xml text/javascript application/x-javascript application/xml+rss application/json application/javascript;

    # OPDS file downloads — stream without buffering, allow large files
    location /api/v1/opds/download/ {
        proxy_pass http://backend:7878/api/v1/opds/download/;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_buffering off;
        proxy_read_timeout 300s;
        proxy_send_timeout 300s;
        proxy_max_temp_file_size 0;
    }

    # API proxy to backend
    location /api/ {
        proxy_pass http://backend:7878/api/;
        proxy_http_version 1.1;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection 'upgrade';
        proxy_set_header Host $host;
        proxy_cache_bypass $http_upgrade;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }

    # Hide nginx version
    server_tokens off;

    # index.html: never cache — browsers and Cloudflare must always fetch it fresh
    # so they pick up the new hashed JS/CSS filenames after each deploy.
    location = /index.html {
        add_header Cache-Control "no-cache, no-store, must-revalidate" always;
        add_header Pragma "no-cache" always;
        add_header Expires "0" always;
    }

    # React Router - serve index.html for all routes
    location / {
        try_files $uri $uri/ /index.html;
        # Prevent Cloudflare from caching SPA navigation responses (HTML)
        add_header Cache-Control "no-cache, no-store, must-revalidate" always;
    }

    # Hashed static assets from Vite build: cache aggressively.
    # Safe because Vite embeds a content hash in every filename —
    # a code change produces a new filename, making old cached files unreachable.
    location /assets/ {
        expires 1y;
        add_header Cache-Control "public, immutable";
        access_log off;
    }

    # Other static files (favicon, manifest, sw.js, etc.): short cache
    location ~* \.(png|jpg|jpeg|gif|ico|svg|woff|woff2|ttf|eot|webmanifest)$ {
        expires 7d;
        add_header Cache-Control "public, max-age=604800";
    }
}
